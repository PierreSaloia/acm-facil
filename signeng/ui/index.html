<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignEng</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════
       APP SHELL
       ═══════════════════════════════════════════════════════════════════ -->
  <div class="app" id="app">

    <!-- ═══════════ SHELL TOPBAR (idioma centro + scale direita) ═══════════ -->
    <div class="lang-bar">
      <div class="lang-bar__left">
        <button class="theme-toggle" id="theme_toggle" type="button"
                data-i18n-title="theme.toggle"
                onclick="App.toggleTheme()">
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>

      <div class="lang-bar__center">
        <div class="lang-switch" role="tablist" aria-label="Language selector">
          <button class="lang-switch__btn is-active" data-lang="pt"
                  data-i18n-title="lang.pt" data-i18n-aria="lang.pt"
                  onclick="I18n.setLang('pt')">
            <svg viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="16" fill="#009c3b"/>
              <polygon points="12,3 21,8 12,13 3,8" fill="#ffdf00"/>
              <circle cx="12" cy="8" r="3" fill="#002776"/>
            </svg>
          </button>
          <button class="lang-switch__btn" data-lang="es"
                  data-i18n-title="lang.es" data-i18n-aria="lang.es"
                  onclick="I18n.setLang('es')">
            <svg viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="16" fill="#aa151b"/>
              <rect y="4" width="24" height="8" fill="#f1bf00"/>
            </svg>
          </button>
          <button class="lang-switch__btn" data-lang="en"
                  data-i18n-title="lang.en" data-i18n-aria="lang.en"
                  onclick="I18n.setLang('en')">
            <svg viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg">
              <rect width="24" height="16" fill="#b22234"/>
              <rect y="2.3" width="24" height="1.3" fill="#fff"/>
              <rect y="4.9" width="24" height="1.3" fill="#fff"/>
              <rect y="7.5" width="24" height="1.3" fill="#fff"/>
              <rect y="10.1" width="24" height="1.3" fill="#fff"/>
              <rect y="12.7" width="24" height="1.3" fill="#fff"/>
              <rect width="10" height="8" fill="#3c3b6e"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="lang-bar__right">
        <!-- UI Scale switcher (75 / 100 / 125 %) -->
        <div class="scale-switch" role="tablist" aria-label="UI scale">
          <button class="scale-switch__btn" data-scale="sm"
                  data-i18n-title="scale.sm" onclick="App.setUiScale('sm')">A</button>
          <button class="scale-switch__btn is-active" data-scale="md"
                  data-i18n-title="scale.md" onclick="App.setUiScale('md')">A</button>
          <button class="scale-switch__btn" data-scale="lg"
                  data-i18n-title="scale.lg" onclick="App.setUiScale('lg')">A</button>
        </div>
      </div>
    </div>

    <!-- ═══════════ CONTAINER DAS VIEWS ═════════════════════════════════ -->
    <div class="app__views">

      <!-- ─────────── VIEW: DASHBOARD ─────────── -->
      <section class="view view--dashboard" data-view="dashboard" hidden>
        <header class="topbar">
          <div class="topbar__brand">
            <div class="topbar__logo-mark">
              <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="seLogoGrad" x1="4" y1="36" x2="36" y2="4" gradientUnits="userSpaceOnUse">
                    <stop offset="0%"  stop-color="#0b1f3a"/>
                    <stop offset="50%" stop-color="#0e7490"/>
                    <stop offset="100%" stop-color="#22d3ee"/>
                  </linearGradient>
                  <linearGradient id="seLogoAccent" x1="24" y1="14" x2="36" y2="2" gradientUnits="userSpaceOnUse">
                    <stop offset="0%"  stop-color="#38bdf8"/>
                    <stop offset="100%" stop-color="#a5f3fc"/>
                  </linearGradient>
                </defs>
                <path d="M20,6 A7,7 0 0 1 20,20 A7,7 0 0 0 20,34" fill="none" stroke="url(#seLogoGrad)" stroke-width="8" stroke-linecap="round"/>
                <polygon points="36,3 25,3 36,14" fill="url(#seLogoAccent)"/>
              </svg>
            </div>
            <span class="topbar__name">SignEng</span>
          </div>
          <nav class="topbar__actions">
            <span class="topbar__user" id="topbar_user">—</span>
            <button class="btn btn--ghost btn--sm" data-i18n-title="settings.open" onclick="App.openSettings()">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <button class="btn btn--ghost btn--sm" onclick="Auth.logout()">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              <span data-i18n="auth.logout">Sair</span>
            </button>
          </nav>
        </header>

        <main class="dashboard">
          <div class="dashboard__header">
            <div class="section-header">
              <div class="section-header__label-row">
                <span class="section-header__label" data-i18n="dash.label">MÓDULOS</span>
                <div class="section-header__divider"></div>
              </div>
              <h2 class="section-header__title">
                <span data-i18n="dash.greeting">Olá,</span>
                <span id="dash_nome">—</span>
              </h2>
              <p class="section-header__subtitle" data-i18n="dash.subtitle">Escolha um gerador para começar.</p>
            </div>
          </div>

          <div id="dash_license_banner" hidden>
            <!-- banner de licença (trial acabando/expirado) — Dashboard._renderLicenseBanner() -->
          </div>

          <div class="dashboard__grid" id="dash_grid">
            <!-- cards injetados por Dashboard.render() -->
          </div>
        </main>
      </section>

      <!-- ─────────── VIEW: MODULE ─────────── -->
      <section class="view view--module" data-view="module" hidden>
        <header class="module-header">
          <button class="btn btn--ghost btn--sm" onclick="Router.goto('dashboard')">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12,19 5,12 12,5"/></svg>
            <span data-i18n="module.back">Voltar</span>
          </button>
          <h1 class="module-header__title" id="module_title">—</h1>
          <div class="module-header__actions">
            <span class="save-badge" id="module_save_badge" hidden aria-live="polite">
              <span class="save-badge__dot"></span>
              <span class="save-badge__text">—</span>
            </span>
            <button class="btn btn--ghost btn--sm" id="module_preset_btn" data-i18n-title="module.preset" onclick="AutoAcm.openPresetsMenu()">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
              <span data-i18n="module.preset">Preset</span>
            </button>
          </div>
        </header>

        <div class="module-body" id="module_body">
          <!-- Conteúdo injetado por Router.mountModule() -->
        </div>
      </section>

    </div>

  </div>

  <!-- ════════════════════════ SCRIPTS (ordem importa) ══════════════════ -->
  <script src="js/bridge.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/router.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
