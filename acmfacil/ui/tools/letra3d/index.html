<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACMFacil — Letra 3D</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="letra3d.css">
</head>
<body>
  <div class="lt3">

    <header class="lt3__header">
      <h1 class="lt3__title" data-key="title">Letra 3D</h1>
      <p class="lt3__subtitle" data-key="subtitle">Letras caixa pra impressão 3D a partir de um SVG.</p>
    </header>

    <div class="lt3__editing" id="lt3_editing" hidden>
      <span id="lt3_editing_txt"></span>
      <button class="btn btn--ghost btn--sm" id="lt3_btn_novo" data-key="novo">Novo</button>
    </div>

    <div class="lt3__scroll">

      <!-- ARQUIVO SVG -->
      <div class="lt3__section">
        <span class="lt3__label" data-key="secArquivo">ARQUIVO (SVG)</span>
        <div class="lt3__file">
          <button class="btn btn--secondary" id="lt3_btn_importar" data-key="importar">Importar SVG</button>
          <span class="lt3__file-nome" id="lt3_file_nome" data-key="nenhumArquivo">nenhum arquivo</span>
        </div>
      </div>

      <!-- PRÉVIA ISOMÉTRICA -->
      <div class="lt3__section">
        <span class="lt3__label" data-key="secPrev">PRÉVIA ISOMÉTRICA</span>
        <div class="lt3__prev" id="lt3_prev"></div>
      </div>

      <!-- CORTE ESQUEMÁTICO -->
      <div class="lt3__section">
        <span class="lt3__label" data-key="secCorte">CORTE DA LETRA (ESQUEMA)</span>
        <div class="lt3__diagram" id="lt3_diag"></div>
      </div>

      <!-- ESCALA -->
      <div class="lt3__section">
        <span class="lt3__label" data-key="secEscala">ESCALA</span>
        <div class="lt3__grid">
          <div class="lt3__field">
            <label data-key="altura">Altura do lettering (mm)</label>
            <input id="lt3_altura" type="number" value="350" min="30" step="10">
          </div>
          <div class="lt3__field">
            <label data-key="prof">Profundidade (mm)</label>
            <input id="lt3_prof" type="number" value="40" min="10" step="1">
          </div>
        </div>
      </div>

      <!-- PAREDE SUPERIOR -->
      <div class="lt3__section">
        <span class="lt3__label" data-key="secParede">PAREDE SUPERIOR (IMPRESSA)</span>
        <div class="lt3__grid">
          <div class="lt3__field">
            <label data-key="paredeExt">Espessura da parede (mm)</label>
            <input id="lt3_parede_ext" type="number" value="3" min="1" step="0.5">
          </div>
          <div class="lt3__field">
            <label data-key="bocaEsp">Boca: espessura (mm)</label>
            <input id="lt3_boca_esp" type="number" value="2" min="0.5" step="0.5">
          </div>
          <div class="lt3__field">
            <label data-key="bocaAlt">Boca: altura (mm)</label>
            <input id="lt3_boca_alt" type="number" value="3" min="1" step="0.5">
          </div>
          <div class="lt3__field">
            <label data-key="folgaAcr">Folga acrílico×boca (mm)</label>
            <input id="lt3_folga_acr" type="number" value="0" min="0" step="0.1">
          </div>
        </div>
      </div>

      <!-- BASE INFERIOR (ENCAIXE) -->
      <div class="lt3__section">
        <span class="lt3__label" data-key="secBaseInf">BASE INFERIOR — ENCAIXE (IMPRESSA)</span>
        <div class="lt3__grid">
          <div class="lt3__field">
            <label data-key="altInt">Altura total (mm)</label>
            <input id="lt3_alt_int" type="number" value="15" min="5" step="1">
          </div>
          <div class="lt3__field">
            <label data-key="folgaInt">Folga p/ parede superior (mm)</label>
            <input id="lt3_folga_int" type="number" value="1" min="0" step="0.1">
          </div>
          <div class="lt3__field">
            <label data-key="paredeInt">Espessura da parede (mm)</label>
            <input id="lt3_parede_int" type="number" value="2" min="1" step="0.5">
          </div>
          <div class="lt3__field">
            <label data-key="abaComp">Aba: comprimento (mm)</label>
            <input id="lt3_aba_comp" type="number" value="10" min="2" step="0.5">
          </div>
          <div class="lt3__field">
            <label data-key="abaEsp">Aba: espessura (mm)</label>
            <input id="lt3_aba_esp" type="number" value="2" min="1" step="0.5">
          </div>
        </div>
      </div>

      <!-- BASE ACM/PVC E ACRÍLICO -->
      <div class="lt3__section">
        <span class="lt3__label" data-key="secFundoAcr">BASE ACM/PVC E ACRÍLICO</span>
        <div class="lt3__grid">
          <div class="lt3__field">
            <label data-key="fundoEsp">Base ACM/PVC (mm)</label>
            <input id="lt3_fundo_esp" type="number" value="2" min="1" step="0.5">
          </div>
          <div class="lt3__field">
            <label data-key="folgaFundo">Folga base×parede do L (mm)</label>
            <input id="lt3_folga_fundo" type="number" value="1" min="0" step="0.1">
          </div>
          <div class="lt3__field">
            <label data-key="acrEsp">Acrílico da face (mm)</label>
            <input id="lt3_acr_esp" type="number" value="2" min="1" step="0.5">
          </div>
          <div class="lt3__field">
            <label data-key="acrTipo">Tipo do acrílico</label>
            <select id="lt3_acr_tipo">
              <option value="leitoso" selected data-key="acrLeitoso">Branco leitoso</option>
              <option value="cristal" data-key="acrCristal">Cristal (adesivo retroverso)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- COR -->
      <div class="lt3__section">
        <span class="lt3__label" data-key="secCor">COR DA LETRA (IMPRESSÃO)</span>
        <div class="lt3__cor">
          <div class="lt3__cor-head">
            <span class="lt3__cor-chip" id="lt3_cor_chip"></span>
            <span class="lt3__cor-nome" id="lt3_cor_nome"></span>
          </div>
          <div class="lt3__cor-tabs" id="lt3_cor_tabs"></div>
          <div class="lt3__cor-grid" id="lt3_cor_grid"></div>
        </div>
      </div>

    </div><!-- /scroll -->

    <p class="lt3__msg" id="lt3_msg"></p>

    <footer class="lt3__footer">
      <button class="btn btn--secondary" id="lt3_btn_carregar" data-key="carregar">Carregar selecionado</button>
      <button class="btn btn--primary" id="lt3_btn_gerar" data-key="gerar">Gerar</button>
    </footer>

  </div>

  <script src="../../js/bridge.js"></script>
  <script src="letra3d.js"></script>
</body>
</html>
