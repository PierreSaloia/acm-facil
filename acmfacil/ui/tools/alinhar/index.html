<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACMFacil — Alinhar</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="alinhar.css">
</head>
<body>
  <div class="aln">

    <!-- HEADER -->
    <header class="aln__header">
      <h1 class="aln__title" data-key="title">Alinhar</h1>
      <p class="aln__subtitle" data-key="subtitle">Alinha o objeto 2 ao objeto 1 (fixo).</p>
    </header>

    <!-- PASSOS: OBJETO 1 E 2 -->
    <div class="aln__steps">
      <div class="aln__step" id="aln_step1">
        <span class="aln__step-num aln__step-num--fixo">1</span>
        <div class="aln__step-info">
          <span class="aln__step-label" data-key="step1">Objeto fixo</span>
          <span class="aln__step-value" id="aln_step1_value" data-key="clickModel">clique no modelo…</span>
        </div>
      </div>
      <div class="aln__step" id="aln_step2">
        <span class="aln__step-num aln__step-num--movel">2</span>
        <div class="aln__step-info">
          <span class="aln__step-label" data-key="step2">Objeto móvel</span>
          <span class="aln__step-value" id="aln_step2_value" data-key="clickModel">clique no modelo…</span>
        </div>
      </div>
    </div>

    <!-- ALINHAMENTO -->
    <div class="aln__section">
      <span class="aln__section-label" data-key="secAlign">ALINHAMENTO</span>
      <div class="aln__align-grid" id="aln_align_grid"></div>
    </div>

    <!-- FACEAMENTO -->
    <div class="aln__section">
      <span class="aln__section-label" data-key="secFace">FACEAMENTO (PROFUNDIDADE)</span>
      <div class="aln__face-list" id="aln_face_list"></div>
    </div>

    <p class="aln__hint" data-key="hint">Referência: a orientação do objeto 1 (fixo). Face = o lado voltado pra você na hora do Aplicar.</p>
    <p class="aln__msg" id="aln_msg"></p>

    <!-- FOOTER -->
    <footer class="aln__footer">
      <button class="btn btn--ghost" id="aln_btn_reset" data-key="reset">Recomeçar</button>
      <button class="btn btn--primary" id="aln_btn_apply" disabled data-key="apply">Aplicar</button>
    </footer>

  </div>

  <script src="../../js/bridge.js"></script>
  <script src="alinhar.js"></script>
</body>
</html>
